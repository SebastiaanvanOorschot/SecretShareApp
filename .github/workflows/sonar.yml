name: CI

on:
  push:
    branches:
      - master
      - development
  pull_request:
    branches:
      - master

jobs:
  # Losse job zodat dit als required check gebruikt kan worden: een falende test
  # blokkeert, ook als SonarCloud zelf onbereikbaar is. Backend en frontend zitten
  # in dezelfde job, zodat die ene required check "Unit tests" beide afdekt.
  test:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Run backend unit tests
        run: dotnet test SecretShareApi/SecretShareApi.sln --configuration Release

      - name: Setup Node 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: SecretShareFrontEnd/yarn.lock

      - name: Install frontend dependencies
        working-directory: SecretShareFrontEnd
        run: yarn install --frozen-lockfile

      - name: Run frontend unit tests
        working-directory: SecretShareFrontEnd
        run: yarn test

  # Bouwt dezelfde images als Railway, zodat een kapotte Dockerfile hier al
  # rood wordt in plaats van pas bij de deploy.
  docker:
    name: Docker images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build API image
        run: docker build SecretShareApi/SecretShareApi

      - name: Build frontend image
        run: docker build SecretShareFrontEnd

  sonar:
    name: Analyse
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Volledige history: Sonar gebruikt git blame om issues aan een auteur
          # en aan een datum te koppelen (nodig voor "new code").
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Cache SonarQube scanner
        uses: actions/cache@v4
        with:
          path: ~/.dotnet/tools
          key: ${{ runner.os }}-sonar-scanner

      - name: Install SonarQube scanner for .NET
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Begin analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet sonarscanner begin \
            /k:"SebastiaanvanOorschot_SecretShareApp" \
            /o:"sebastiaanvanoorschot" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.exclusions="**/node_modules/**,**/dist/**,**/bin/**,**/obj/**,**/coverage/**" \
            /d:sonar.cs.opencover.reportsPaths="**/TestResults/**/coverage.opencover.xml" \
            /d:sonar.javascript.lcov.reportPaths="SecretShareFrontEnd/coverage/lcov.info" \
            /d:sonar.coverage.exclusions="**/Migrations/**,**/Program.cs,**/__tests__/**,SecretShareFrontEnd/src/main.ts,SecretShareFrontEnd/vite.config.mts"

      - name: Build backend
        run: dotnet build SecretShareApi/SecretShareApi.sln --configuration Release

      # Alleen voor de coverage in Sonar; het blokkeren gebeurt in de test job
      - name: Collect coverage
        run: >
          dotnet test SecretShareApi/SecretShareApi.sln --configuration Release --no-build
          --collect:"XPlat Code Coverage;Format=opencover"

      - name: Setup Node 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: SecretShareFrontEnd/yarn.lock

      - name: Collect frontend coverage
        working-directory: SecretShareFrontEnd
        run: |
          yarn install --frozen-lockfile
          yarn test:coverage

      - name: End analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
